name: Build chiaki-ng (chọn bản build)
run-name: Build ${{ inputs.ref }} - ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Nhánh / tag / commit cần build'
        required: true
        default: 'new_main'
        type: string
      target:
        description: 'Bản cần build (chạy đúng file workflow ghi sau dấu |)'
        required: true
        default: 'macOS Intel x86_64 | build-macos-intel.yml'
        type: choice
        options:
          - 'macOS Intel x86_64 | build-macos-intel.yml'
          - 'macOS arm64 (chip M) | build-macos-arm.yml'
          - 'macOS arm64 (chip M) | build-macos.yml'
          - 'Windows x64 MSYS2 | build-msys2.yml'
          - 'Windows x64 MSYS2 SDL2 | build-msys2-sdl2.yml'
          - 'Windows x64 VC | build-windows-x86.yml'
          - 'Windows arm64 MSYS2 | build-msys2-arm.yml'
          - 'Windows arm64 VC | build-windows-arm.yml'
          - 'Windows arm64 VC portable | build-windows-arm-portable.yml'
          - 'Android APK | build-android.yml'
      create_release:
        description: 'Tạo GitHub Release (giữ file lâu dài, tải không cần đăng nhập)'
        required: false
        default: false
        type: boolean
      brew_snapshot:
        description: 'Chỉ cho macOS Intel: ngày chốt homebrew-core (YYYY-MM-DD, trước 2026-08-28)'
        required: false
        default: '2026-08-20'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_full: ${{ steps.resolve.outputs.sha_full }}
      slug: ${{ steps.resolve.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve commit and target
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
        run: |
          file="${TARGET##*| }"
          slug="${file%.yml}"
          slug="${slug#build-}"
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "sha_full=$(git rev-parse HEAD)"
            echo "slug=${slug}"
          } >> "$GITHUB_OUTPUT"
          echo "Build ${file} @ $(git rev-parse HEAD)"

  build-macos-intel:
    name: macOS Intel x86_64
    needs: prepare
    if: endsWith(inputs.target, '| build-macos-intel.yml')
    uses: ./.github/workflows/build-macos-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}
      brew_snapshot: ${{ inputs.brew_snapshot }}

  build-macos-arm:
    name: macOS arm64 (build-macos-arm)
    needs: prepare
    if: endsWith(inputs.target, '| build-macos-arm.yml')
    uses: ./.github/workflows/build-macos-arm.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-macos:
    name: macOS arm64 (build-macos)
    needs: prepare
    if: endsWith(inputs.target, '| build-macos.yml')
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-msys2:
    name: Windows x64 MSYS2
    needs: prepare
    if: endsWith(inputs.target, '| build-msys2.yml')
    uses: ./.github/workflows/build-msys2.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-msys2-sdl2:
    name: Windows x64 MSYS2 SDL2
    needs: prepare
    if: endsWith(inputs.target, '| build-msys2-sdl2.yml')
    uses: ./.github/workflows/build-msys2-sdl2.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-windows-x86:
    name: Windows x64 VC
    needs: prepare
    if: endsWith(inputs.target, '| build-windows-x86.yml')
    uses: ./.github/workflows/build-windows-x86.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-msys2-arm:
    name: Windows arm64 MSYS2
    needs: prepare
    if: endsWith(inputs.target, '| build-msys2-arm.yml')
    uses: ./.github/workflows/build-msys2-arm.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-windows-arm:
    name: Windows arm64 VC
    needs: prepare
    if: endsWith(inputs.target, '| build-windows-arm.yml')
    uses: ./.github/workflows/build-windows-arm.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-windows-arm-portable:
    name: Windows arm64 VC portable
    needs: prepare
    if: endsWith(inputs.target, '| build-windows-arm-portable.yml')
    uses: ./.github/workflows/build-windows-arm-portable.yml
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  build-android:
    name: Android APK
    needs: prepare
    if: endsWith(inputs.target, '| build-android.yml')
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha_full }}

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build-macos-intel
      - build-macos-arm
      - build-macos
      - build-msys2
      - build-msys2-sdl2
      - build-windows-x86
      - build-msys2-arm
      - build-windows-arm
      - build-windows-arm-portable
      - build-android
    if: >-
      always() && inputs.create_release &&
      needs.prepare.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.create.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
          SHA: ${{ needs.prepare.outputs.sha_full }}
          SLUG: ${{ needs.prepare.outputs.slug }}
        run: |
          short="${SHA::7}"
          safe_ref=$(echo "$REF" | tr '/\\: ' '----')
          tag="build-${safe_ref}-${short}"
          prefix="chiaki-ng-${SLUG}-${safe_ref}-${short}"

          mkdir -p out
          for f in dist/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *.dmg) new="${prefix}.dmg" ;;
              *.exe) new="${prefix}-installer.exe" ;;
              *.zip) new="${prefix}-portable.zip" ;;
              *.apk) new="${prefix}.apk" ;;
              *)     new="${prefix}-${base}" ;;
            esac
            mv "$f" "out/${new}"
          done
          ls -la out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::Không có file nào để đưa lên Release"
            exit 1
          fi

          notes=$(printf 'Build tự động từ `%s` (commit %s).\n\nApp chưa được ký: trên macOS dùng System Settings > Privacy & Security > Open Anyway hoặc `xattr -cr /Applications/chiaki-ng.app`; trên Windows chọn More info > Run anyway; trên Android cho phép cài ứng dụng từ nguồn không xác định.' "$REF" "$short")

          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "chiaki-ng ${REF} (${short})" \
              --notes "$notes" \
              --prerelease
          fi

          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"

  notify-telegram:
    name: Telegram notification
    needs:
      - prepare
      - build-macos-intel
      - build-macos-arm
      - build-macos
      - build-msys2
      - build-msys2-sdl2
      - build-windows-x86
      - build-msys2-arm
      - build-windows-arm
      - build-windows-arm-portable
      - build-android
      - release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download Android APK
        if: needs.build-android.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: chiaki-ng-android-Release
          path: apk

      - name: Send Telegram message
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1004406444186'
          NEEDS_JSON: ${{ toJSON(needs) }}
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          SHA: ${{ needs.prepare.outputs.sha || '-' }}
          SHA_FULL: ${{ needs.prepare.outputs.sha_full || '-' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          TELEGRAM_BOT_TOKEN=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          TELEGRAM_CHAT_ID=$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Secret TELEGRAM_BOT_TOKEN chưa được tạo, bỏ qua thông báo Telegram"
            exit 0
          fi

          tg() {
            local method="$1"; shift
            local resp
            resp=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}" "$@" || true)
            if printf '%s' "$resp" | jq -e '.ok == true' > /dev/null 2>&1; then
              return 0
            fi
            local reason
            reason=$(printf '%s' "$resp" | jq -r '[.description, (.parameters.migrate_to_chat_id // empty | "migrate_to_chat_id=\(.)")] | join(" | ")' 2>/dev/null || true)
            echo "::error::Telegram ${method} lỗi (chat_id=${TELEGRAM_CHAT_ID}): ${reason:-$resp}"
            return 1
          }

          status() {
            case "$1" in
              success)   echo "Thành công" ;;
              failure)   echo "LỖI" ;;
              cancelled) echo "Đã hủy" ;;
              skipped)   echo "Bỏ qua" ;;
              *)         echo "$1" ;;
            esac
          }

          if [ "$PREPARE_RESULT" = "success" ]; then
            build_result=$(printf '%s' "$NEEDS_JSON" | jq -r '[to_entries[] | select(.key | startswith("build-")) | .value.result | select(. != "skipped")] | first // "skipped"')
          else
            build_result="$PREPARE_RESULT"
          fi

          if [ "$build_result" = "failure" ]; then
            title="[LỖI] chiaki-ng build thất bại"
          elif [ "$build_result" = "cancelled" ]; then
            title="[HỦY] chiaki-ng build bị hủy"
          elif [ "$RELEASE_RESULT" = "failure" ]; then
            title="[LỖI] chiaki-ng build xong nhưng tạo Release thất bại"
          else
            title="[OK] chiaki-ng build thành công"
          fi

          if [ -n "$RELEASE_URL" ]; then
            release_line="Release (tải không cần đăng nhập): ${RELEASE_URL}"
          elif [ "$RELEASE_RESULT" = "failure" ]; then
            release_line="Release: LỖI, xem log"
          else
            release_line="Release: không tạo"
          fi

          text=$(printf '%s\n\nBản build: %s\nNhánh: %s\nCommit: %s\nKết quả: %s\n\n%s\n\nNgười chạy: %s\nLog / artifacts: %s' \
            "$title" "$TARGET" "$REF" "$SHA" "$(status "$build_result")" \
            "$release_line" \
            "$ACTOR" "$RUN_URL")

          err_re='##\[error\]|[Ee]rror:|ERROR:|[Ff]atal:|FAILED|CMake Error|undefined reference|No such file or directory|command not found|Process completed with exit code'
          mkdir -p logs
          : > failed_jobs.tsv
          if [ "$build_result" = "failure" ] || [ "$RELEASE_RESULT" = "failure" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' \
              < /dev/null > failed_jobs.tsv || echo "::warning::Không lấy được danh sách job lỗi"
          fi

          summary=""
          while IFS=$'\t' read -r job_id job_name; do
            [ -n "$job_id" ] || continue
            safe=$(printf '%s' "$job_name" | tr -c 'A-Za-z0-9._-' '_')
            steps=$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}" \
              --jq '[.steps[] | select(.conclusion == "failure") | .name] | join(", ")' < /dev/null || true)

            raw="logs/${safe}.raw"
            log_status=""
            for i in $(seq 1 12); do
              code=$(curl -sSL -o "$raw" -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" || true)
              if [ "$code" = "200" ] && [ -s "$raw" ]; then
                log_status=""
                break
              fi
              log_status="HTTP ${code}: $(head -c 300 "$raw" 2>/dev/null)"
              echo "::warning::Chưa tải được log job ${job_id} (lần ${i}): ${log_status}"
              : > "$raw"
              sleep 15
            done
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//' "$raw" > "logs/${safe}.log" || true
            errors=$(grep -E "$err_re" "logs/${safe}.log" | tail -n 40 || true)
            annotations=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${job_id}/annotations" \
              --jq '.[] | select(.annotation_level != "notice") | "[\(.annotation_level)] \(.message)"' < /dev/null || true)
            if [ -z "$errors" ] && [ -n "$annotations" ]; then
              errors="$annotations"
            fi

            report="logs/${safe}-error.txt"
            {
              echo "Run: ${RUN_URL}"
              echo "Bản build: ${TARGET}"
              echo "Job: ${job_name}"
              echo "Nhánh: ${REF}"
              echo "Commit: ${SHA_FULL}"
              echo "Step lỗi: ${steps:-không rõ}"
              if [ -n "$log_status" ]; then
                echo "KHÔNG TẢI ĐƯỢC LOG: ${log_status}"
              fi
              echo
              echo "===== Annotations ====="
              echo "${annotations:-(không có)}"
              echo
              echo "===== Các dòng lỗi ====="
              echo "${errors:-(không tìm thấy dòng lỗi rõ ràng, xem 300 dòng cuối)}"
              echo
              echo "===== 300 dòng cuối ====="
              tail -n 300 "logs/${safe}.log"
              echo
              echo "===== Log đầy đủ ====="
              cat "logs/${safe}.log"
            } > "$report"
            if [ "$(stat -c %s "$report")" -gt 45000000 ]; then
              gzip -9 "$report"
            fi

            summary+=$'\n\n'"--- ${job_name} ---"$'\n'"Step lỗi: ${steps:-không rõ}"
            if [ -n "$errors" ]; then
              summary+=$'\n'"$(printf '%s\n' "$errors" | tail -n 12 | cut -c1-300)"
            fi
          done < failed_jobs.tsv

          if [ -n "$summary" ]; then
            text+=$'\n\n'"===== CHI TIẾT LỖI =====${summary}"$'\n\n'"File log đầy đủ gửi kèm bên dưới."
          fi
          if [ "${#text}" -gt 3900 ]; then
            text="${text:0:3900}"$'\n...(đã cắt bớt, xem file log)'
          fi

          tg sendMessage \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true"

          for f in logs/*-error.txt logs/*-error.txt.gz; do
            [ -f "$f" ] || continue
            tg sendDocument \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${f}" \
              --form-string "caption=Log lỗi ${REF} (${SHA}): $(basename "$f")" \
              || echo "::warning::Gửi file $f lên Telegram thất bại"
          done

          for f in apk/*.apk; do
            [ -f "$f" ] || continue
            safe_ref=$(echo "$REF" | tr '/\\: ' '----')
            named="apk/chiaki-ng-android-${safe_ref}-${SHA}.apk"
            mv "$f" "$named"
            if [ "$(stat -c %s "$named")" -gt 49000000 ]; then
              echo "::warning::APK lớn hơn 49 MB, Telegram không nhận; tải trong artifacts của run"
              continue
            fi
            tg sendDocument \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${named}" \
              --form-string "caption=APK Android ${REF} (${SHA})" \
              || echo "::warning::Gửi APK lên Telegram thất bại"
          done
