name: Build chiaki-ng macOS Intel + Windows x64
run-name: Build ${{ inputs.ref }} (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Nhánh / tag / commit cần build'
        required: true
        default: 'new_main'
        type: string
      platform:
        description: 'Nền tảng cần build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-intel
          - windows
      create_release:
        description: 'Tạo GitHub Release (giữ file lâu dài, tải không cần đăng nhập)'
        required: false
        default: false
        type: boolean
      brew_snapshot:
        description: 'macOS Intel: ngày chốt homebrew-core (YYYY-MM-DD, trước 2026-08-28 để còn gói dựng sẵn cho Intel)'
        required: false
        default: '2026-08-20'
        type: string

jobs:
  build-mac_x86_64:
    name: Build macOS Intel (x86_64)
    if: inputs.platform == 'all' || inputs.platform == 'macos-intel'
    runs-on: macos-15-intel
    timeout-minutes: 360
    outputs:
      sha: ${{ steps.label.outputs.sha }}
      sha_full: ${{ steps.label.outputs.sha_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Build label
        id: label
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "BUILD_LABEL=$(echo "$REF" | tr '/\\:' '---')-${sha}" >> "$GITHUB_ENV"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Qt from the official installer (universal binaries) instead of Homebrew,
      # since Homebrew no longer guarantees Intel bottles for large formulae like qt@6
      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: mac
          target: desktop
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets'
          cache: true

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      # Homebrew stopped building macOS Intel bottles on 2026-08-28; newer formulae
      # would build from source (and fetch from the often unreachable ftp.gnu.org)
      - name: Pin homebrew-core to a snapshot with Intel bottles
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ inputs.brew_snapshot || '2026-08-20' }}
        run: |
          sha=$(gh api "repos/Homebrew/homebrew-core/commits?until=${SNAPSHOT}T00:00:00Z&per_page=1" --jq '.[0].sha')
          if [ -z "$sha" ]; then
            echo "::error::Không tìm thấy commit homebrew-core trước ${SNAPSHOT}"
            exit 1
          fi
          echo "homebrew-core snapshot ${SNAPSHOT}: ${sha}"

          core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          rm -rf "$core"
          mkdir -p "$core"
          git -C "$core" init -q
          git -C "$core" remote add origin https://github.com/Homebrew/homebrew-core
          git -C "$core" fetch -q --depth=1 origin "$sha"
          git -C "$core" checkout -q FETCH_HEAD

          {
            echo "HOMEBREW_NO_INSTALL_FROM_API=1"
            echo "HOMEBREW_NO_AUTO_UPDATE=1"
            echo "HOMEBREW_NO_INSTALL_UPGRADE=1"
            echo "HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1"
          } >> "$GITHUB_ENV"

      - name: Install brew dependencies
        run: |
          brew uninstall pkgconfig || true
          brew install ffmpeg pkgconfig opus openssl@3 cmake ninja nasm protobuf@29 speexdsp libplacebo wget python-setuptools json-c miniupnpc libevent

      - name: Install sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/protobuf@29"

      - name: Build chiaki-ng
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          rm -rf chiaki-ng.app chiaki-ng.dmg
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          MACDEPLOYQT="${QT_ROOT_DIR}/bin/macdeployqt"
          "$MACDEPLOYQT" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          wget https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar && tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d
          "$MACDEPLOYQT" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          WEBENGINE_HELPER=chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          if [[ -d "$WEBENGINE_HELPER" && ! -e "$WEBENGINE_HELPER/Frameworks" ]]
          then
            ln -s ../../../../../../../Frameworks "$WEBENGINE_HELPER"
          fi
          cp /usr/local/lib/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL3.dylib
          cp /usr/local/lib/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -id @executable_path/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL3.dylib
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -change /usr/local/lib/libSDL3.dylib @executable_path/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change @rpath/libSDL3.dylib @executable_path/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /usr/local/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
          install_name_tool -change @rpath/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
          [[ -e chiaki-ng.app/Contents/Frameworks/vulkan ]] || ln -s libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          hdiutil create -srcfolder chiaki-ng.app chiaki-ng.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.dmg
          cp chiaki-ng.dmg "chiaki-ng-macos_x86_64-${BUILD_LABEL}.dmg"

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_x86_64-${{ env.BUILD_LABEL }}
          path: chiaki-ng-macos_x86_64-*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows_x64-msys2:
    name: Build Windows x64 (MSYS2)
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.label.outputs.sha }}
      sha_full: ${{ steps.label.outputs.sha_full }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Build label
        id: label
        shell: pwsh
        env:
          REF: ${{ inputs.ref }}
        run: |
          $sha = git rev-parse --short HEAD
          $label = ($env:REF -replace '[/\\:]', '-') + '-' + $sha
          "BUILD_LABEL=$label" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha_full=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            compiler-rt:p

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Package chiaki-ng
        run: |
          zip -r "chiaki-ng-win_x64-portable-${BUILD_LABEL}.zip" chiaki-ng-Win

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-portable-${{ env.BUILD_LABEL }}
          path: chiaki-ng-win_x64-portable-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-installer-${{ env.BUILD_LABEL }}
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [ build-mac_x86_64, build-windows_x64-msys2 ]
    if: >-
      always() && inputs.create_release &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.create.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chiaki-ng-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.build-mac_x86_64.outputs.sha_full || needs.build-windows_x64-msys2.outputs.sha_full }}
        run: |
          short="${SHA::7}"
          safe_ref=$(echo "$REF" | tr '/\\: ' '----')
          tag="build-${safe_ref}-${short}"

          if [ -f dist/chiaki-ng-windows-installer.exe ]; then
            mv dist/chiaki-ng-windows-installer.exe "dist/chiaki-ng-win_x64-installer-${safe_ref}-${short}.exe"
          fi
          ls -la dist

          notes=$(printf 'Build tự động từ `%s` (commit %s).\n\n- macOS Intel: file `.dmg` (cần macOS 15 trở lên)\n- Windows x64: bản portable `.zip` và trình cài đặt `.exe`\n\nApp chưa được ký: trên macOS dùng System Settings > Privacy & Security > Open Anyway hoặc `xattr -cr /Applications/chiaki-ng.app`; trên Windows chọn More info > Run anyway.' "$REF" "$short")

          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "chiaki-ng ${REF} (${short})" \
              --notes "$notes" \
              --prerelease
          fi

          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"

  notify-telegram:
    name: Telegram notification
    needs: [ build-mac_x86_64, build-windows_x64-msys2, release ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Send Telegram message
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REF: ${{ inputs.ref }}
          PLATFORM: ${{ inputs.platform }}
          MAC_RESULT: ${{ needs.build-mac_x86_64.result }}
          WIN_RESULT: ${{ needs.build-windows_x64-msys2.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          SHA: ${{ needs.build-mac_x86_64.outputs.sha || needs.build-windows_x64-msys2.outputs.sha || '-' }}
          SHA_FULL: ${{ needs.build-mac_x86_64.outputs.sha_full || needs.build-windows_x64-msys2.outputs.sha_full || '-' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets not set, skipping notification"
            exit 0
          fi

          status() {
            case "$1" in
              success)   echo "Thành công" ;;
              failure)   echo "LỖI" ;;
              cancelled) echo "Đã hủy" ;;
              skipped)   echo "Bỏ qua" ;;
              *)         echo "$1" ;;
            esac
          }

          if [ "$MAC_RESULT" = "failure" ] || [ "$WIN_RESULT" = "failure" ]; then
            title="[LỖI] chiaki-ng build thất bại"
          elif [ "$MAC_RESULT" = "cancelled" ] || [ "$WIN_RESULT" = "cancelled" ]; then
            title="[HỦY] chiaki-ng build bị hủy"
          elif [ "$RELEASE_RESULT" = "failure" ]; then
            title="[LỖI] chiaki-ng build xong nhưng tạo Release thất bại"
          else
            title="[OK] chiaki-ng build thành công"
          fi

          if [ -n "$RELEASE_URL" ]; then
            release_line="Release (tải không cần đăng nhập): ${RELEASE_URL}"
          elif [ "$RELEASE_RESULT" = "failure" ]; then
            release_line="Release: LỖI, xem log"
          else
            release_line="Release: không tạo"
          fi

          text=$(printf '%s\n\nNhánh: %s\nCommit: %s\nNền tảng: %s\n\nmacOS Intel: %s\nWindows x64: %s\n\n%s\n\nNgười chạy: %s\nLog / artifacts: %s' \
            "$title" "$REF" "$SHA" "$PLATFORM" \
            "$(status "$MAC_RESULT")" "$(status "$WIN_RESULT")" \
            "$release_line" \
            "$ACTOR" "$RUN_URL")

          err_re='##\[error\]|[Ee]rror:|ERROR:|[Ff]atal:|FAILED|CMake Error|undefined reference|No such file or directory|command not found|Process completed with exit code'
          mkdir -p logs
          : > failed_jobs.tsv
          if [ "$MAC_RESULT" = "failure" ] || [ "$WIN_RESULT" = "failure" ] || [ "$RELEASE_RESULT" = "failure" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' \
              < /dev/null > failed_jobs.tsv || echo "::warning::Không lấy được danh sách job lỗi"
          fi

          summary=""
          while IFS=$'\t' read -r job_id job_name; do
            [ -n "$job_id" ] || continue
            safe=$(printf '%s' "$job_name" | tr -c 'A-Za-z0-9._-' '_')
            steps=$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}" \
              --jq '[.steps[] | select(.conclusion == "failure") | .name] | join(", ")' < /dev/null || true)

            raw="logs/${safe}.raw"
            for i in 1 2 3 4 5 6; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" < /dev/null > "$raw" 2>/dev/null && [ -s "$raw" ] && break
              sleep 10
            done
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//' "$raw" > "logs/${safe}.log" || true
            errors=$(grep -E "$err_re" "logs/${safe}.log" | tail -n 40 || true)

            report="logs/${safe}-error.txt"
            {
              echo "Run: ${RUN_URL}"
              echo "Job: ${job_name}"
              echo "Nhánh: ${REF}"
              echo "Commit: ${SHA_FULL}"
              echo "Step lỗi: ${steps:-không rõ}"
              echo
              echo "===== Các dòng lỗi ====="
              echo "${errors:-(không tìm thấy dòng lỗi rõ ràng, xem 300 dòng cuối)}"
              echo
              echo "===== 300 dòng cuối ====="
              tail -n 300 "logs/${safe}.log"
              echo
              echo "===== Log đầy đủ ====="
              cat "logs/${safe}.log"
            } > "$report"
            if [ "$(stat -c %s "$report")" -gt 45000000 ]; then
              gzip -9 "$report"
            fi

            summary+=$'\n\n'"--- ${job_name} ---"$'\n'"Step lỗi: ${steps:-không rõ}"
            if [ -n "$errors" ]; then
              summary+=$'\n'"$(printf '%s\n' "$errors" | tail -n 12 | cut -c1-300)"
            fi
          done < failed_jobs.tsv

          if [ -n "$summary" ]; then
            text+=$'\n\n'"===== CHI TIẾT LỖI =====${summary}"$'\n\n'"File log đầy đủ gửi kèm bên dưới."
          fi
          if [ "${#text}" -gt 3900 ]; then
            text="${text:0:3900}"$'\n...(đã cắt bớt, xem file log)'
          fi

          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null

          for f in logs/*-error.txt logs/*-error.txt.gz; do
            [ -f "$f" ] || continue
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${f}" \
              --form-string "caption=Log lỗi ${REF} (${SHA}): $(basename "$f")" > /dev/null \
              || echo "::warning::Gửi file $f lên Telegram thất bại"
          done
